<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor de decisiones</title>
<!-- WIDGET 1 · MONITOR DE DECISIONES (Módulo 5) — Cartilla de Karen Daniela Urrego Silva · Universidad de Cundinamarca -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--g:#00482B;--g2:#0b6b43;--y:#FBE122;--dark:#2D2D2D;--mint:#EAF2EE;--line:#D5E3DB;--muted:#56645C;
    --ok:#1f9d55;--okbg:#e3f5ea;--mid:#c99700;--midbg:#fff6d6;--bad:#d7263d;--badbg:#fde6e9}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--dark);font-family:"Century Gothic","Montserrat","Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
  .wrap{padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-width:940px;margin:auto}
  .top{display:flex;align-items:center;gap:12px;background:var(--g);color:#fff;border-radius:16px;padding:12px 16px}
  .top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.01em}
  .top p{margin:0;font-size:13px;opacity:.85}
  .top .pulse{width:46px;height:46px;flex:none;border-radius:50%;background:var(--y);display:grid;place-items:center;animation:beat 1.2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .role{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;transition:.15s;background:#fff}
  .role:hover{border-color:var(--g)}
  .role[aria-pressed="true"]{border-color:var(--g);background:var(--mint);box-shadow:inset 0 -4px 0 var(--y)}
  .role small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g2)}
  .role b{font-size:16px}
  .role .st{font-size:12px;color:var(--muted)}
  .monitor{background:#0f1f17;border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .monitor svg{width:100%;height:64px;display:block}
  .monitor .read{color:#b9f5cf;font-family:ui-monospace,Consolas,monospace;text-align:right;font-size:12px;line-height:1.3}
  .monitor .read b{display:block;font-size:26px;color:#fff;font-family:"Montserrat",Arial,sans-serif}
  .stage{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:11px;min-height:230px}
  .sit{background:var(--mint);border-radius:10px;padding:10px 12px}
  .q{font-size:19px;font-weight:800;margin:0;color:var(--g)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:10px 14px;transition:.15s}
  .opt:hover:not([disabled]){border-color:var(--g);background:var(--mint)}
  .opt[disabled]{cursor:default;opacity:.45}
  .opt.g{background:var(--okbg);border-color:var(--ok);opacity:1}.opt.y{background:var(--midbg);border-color:var(--mid);opacity:1}.opt.r{background:var(--badbg);border-color:var(--bad);opacity:1}
  .fb{border-radius:12px;padding:10px 13px;border-left:6px solid}
  .fb.g{background:var(--okbg);border-color:var(--ok)}.fb.y{background:var(--midbg);border-color:var(--mid)}.fb.r{background:var(--badbg);border-color:var(--bad)}
  .fb strong{display:block}
  .fb .tag{display:inline-block;margin-top:5px;font-size:12px;font-weight:800;background:#fff;border-radius:999px;padding:2px 10px;color:var(--g)}
  .btn{all:unset;cursor:pointer;background:var(--g);color:#fff;font-weight:800;border-radius:999px;padding:10px 20px;align-self:flex-start;box-shadow:0 3px 0 #002a19}
  .btn.y{background:var(--y);color:var(--dark);box-shadow:0 3px 0 #c9b200}
  .role:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--y);outline-offset:2px}
  .empty{margin:auto;text-align:center;color:var(--muted)}
  .res{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .big{font-size:46px;font-weight:800;color:var(--g);line-height:1}
  @media (max-width:640px){.roles{grid-template-columns:1fr}.monitor{grid-template-columns:1fr}.monitor .read{text-align:left}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head><body>
<div class="wrap">
  <div class="top"><div class="pulse" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9C1.2 8.9 3 5 6.6 5c2.1 0 3.4 1.3 4.1 2.4h2.6C14 6.3 15.3 5 17.4 5 21 5 22.8 8.9 21.3 12 19 16.6 12 21 12 21z" fill="#00482B"/></svg></div>
    <div><h1>Monitor de decisiones</h1><p>Elige un rol y decide. El monitor mostrará si tu decisión mantiene “sano” al grupo.</p></div></div>
  <div class="roles" id="roles"></div>
  <div class="monitor" aria-hidden="true"><svg viewBox="0 0 600 64" preserveAspectRatio="none"><path id="ecg" d="" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="read"><b id="bpm">--</b><span id="state">Esperando decisión</span></div></div>
  <div class="stage" id="stage"><p class="empty">Selecciona un rol para comenzar.</p></div>
</div>
<script>
const CASOS=[
 {rol:"Recreador/a comunitario/a",t:"Conflicto en equipo",s:"Coordinas un grupo de caminata y rumba aeróbica para adultos mayores en el parque. Dos participantes discuten porque una siempre se ubica adelante, frente al instructor, y el grupo se está dividiendo.",d:[
  {p:"¿Qué haces primero?",o:[
   ["Hablo con ambas en privado, escucho a cada una y propongo rotar posiciones cada sesión.","g","Escuchas sin exponerlas y propones una regla justa para todos.","Inteligencia emocional + Comunicación"],
   ["Les pido que se calmen frente a todo el grupo y sigo la clase.","y","Detienes la discusión, pero el conflicto queda sin resolver.","Liderazgo"],
   ["No intervengo: son adultas y deben arreglarlo solas.","r","El grupo sigue dividiéndose y algunas personas pueden dejar de asistir.","—"]]},
  {p:"¿Cómo fortaleces la unión del grupo?",o:[
   ["Organizo una actividad en parejas que cambian cada 5 minutos y cerramos con un compartir saludable.","g","La interacción con todos construye amistad y cuida la salud emocional del grupo.","Trabajo en equipo"],
   ["Divido el grupo en dos horarios para que no se crucen.","y","Evitas el roce, pero pierdes la oportunidad de unir al grupo.","Resolución de problemas"],
   ["Saco del grupo a quien más se queja.","r","Excluyes en vez de educar; va contra el respeto y la recreación incluyente.","—"]]}]},
 {rol:"Docente de Educación Física",t:"Falta de compromiso",s:"En un colegio implementaste pausas activas de 10 minutos. Después de dos semanas, muchos estudiantes se quedan sentados y dicen que les da pena moverse frente a los demás.",d:[
  {p:"¿Cuál es tu primera acción?",o:[
   ["Pregunto qué les incomoda y dejo que propongan ejercicios y música.","g","Al escucharlos, la pausa se vuelve de ellos y aumenta el compromiso.","Comunicación"],
   ["Hago la pausa obligatoria y le pongo nota.","y","Puede subir la participación, pero sin disfrute la recreación pierde sentido.","Liderazgo"],
   ["Elimino las pausas activas.","r","Renuncias a un hábito saludable sin buscar alternativas.","—"]]},
  {p:"¿Cómo mantienes la participación en el tiempo?",o:[
   ["Formo “líderes de pausa” que rotan cada semana y guían a su curso.","g","Das protagonismo a los estudiantes: liderazgo y trabajo en equipo.","Liderazgo + Trabajo en equipo"],
   ["Muestro un video sobre los beneficios de moverse.","y","Informa, pero por sí solo no cambia la experiencia.","Comunicación"],
   ["Que participe solo quien quiera; el resto sigue con el celular.","r","El grupo se divide y el hábito no se construye.","—"]]}]},
 {rol:"Gestor/a deportivo/a",t:"Presión por resultados",s:"Diriges un programa municipal de recreación. La alcaldía exige mostrar más asistentes en el informe y te sugieren contar dos veces a quienes van a varias actividades.",d:[
  {p:"¿Qué cifras reportas?",o:[
   ["Las reales, y explico el impacto con indicadores: permanencia, satisfacción y hábitos saludables.","g","Honestidad y comunicación con evidencia: el respeto también es hacia la comunidad.","Comunicación"],
   ["Las reales, pero sin explicar nada más.","y","Eres honesto, pero pierdes la oportunidad de mostrar el valor del programa.","—"],
   ["Inflo las cifras como me sugieren.","r","Falsear datos rompe la confianza y va contra los valores olímpicos.","—"]]},
  {p:"¿Cómo aumentas la participación de verdad?",o:[
   ["Hago un diagnóstico con la comunidad y ajusto horarios y actividades a sus intereses.","g","Resuelves el problema desde las necesidades reales de las personas.","Resolución de problemas"],
   ["Hago más publicidad en redes sociales.","y","Ayuda a que te conozcan, pero no resuelve por qué la gente no asiste.","—"],
   ["Obligo a los colegios a enviar estudiantes.","r","Sube el número, no el bienestar; la recreación es voluntaria.","—"]]}]}
];
const LBL={g:"Ritmo saludable: buena decisión",y:"Ritmo irregular: decisión a medias",r:"Alerta: decisión a revisar"};
const BPM={g:[72,"Estable"],y:[108,"Irregular"],r:[142,"¡Alerta!"]};
const $=id=>document.getElementById(id);const done={};let ci=null,step=0,got=[];
/* monitor ECG */
let mode="idle",off=0;const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function beat(x,amp,k){return [[x,32],[x+8,32],[x+12,32-4*k],[x+16,32],[x+20,32+6*k],[x+24,32-amp],[x+28,32+amp*0.5],[x+32,32],[x+44,32-6*k],[x+52,32]]}
function path(){const amp={idle:4,g:22,y:18,r:28}[mode],k={idle:.3,g:1,y:1.4,r:1.8}[mode],gap={idle:120,g:100,y:70,r:45}[mode];
  let pts=[];for(let x=-gap+(off%gap);x<620;x+=gap){pts=pts.concat(beat(x,amp*(mode==="y"&&Math.random()<.5?.5:1),k));pts.push([x+gap-1,32])}
  $("ecg").setAttribute("d","M"+pts.map(p=>p.join(" ")).join(" L"));$("ecg").setAttribute("stroke",{idle:"#3ddc84",g:"#3ddc84",y:"#ffd23f",r:"#ff4d5e"}[mode]);}
function loop(){off+=mode==="r"?5:3;path();if(!RM)requestAnimationFrame(loop)}loop();
function setMon(c){mode=c;$("bpm").textContent=c==="idle"?"--":BPM[c][0]+" lpm";$("state").textContent=c==="idle"?"Esperando decisión":BPM[c][1];path()}
function roles(){$("roles").innerHTML=CASOS.map((c,i)=>`<button class="role" data-i="${i}" aria-pressed="${ci===i}"><small>${c.rol}</small><b>${c.t}</b><span class="st">${done[i]?"Resuelto · "+done[i].filter(x=>x==="g").length+"/2 decisiones saludables":"2 decisiones"}</span></button>`).join("");
  document.querySelectorAll(".role").forEach(b=>b.onclick=()=>{ci=+b.dataset.i;step=0;got=[];setMon("idle");roles();draw()})}
function draw(){const st=$("stage"),c=CASOS[ci];
  if(step>=c.d.length){done[ci]=got.slice();roles();const g=got.filter(x=>x==="g").length;setMon(g===2?"g":g===1?"y":"r");
    st.innerHTML=`<div class="res"><span class="big">${g}/2</span><div><b style="font-size:18px;color:var(--g)">${g===2?"¡Grupo sano y unido!":g===1?"El grupo resiste, pero hay que ajustar":"El grupo necesita atención"}</b><p style="margin:2px 0;color:var(--muted)">Decisiones saludables en el caso “${c.t}”.</p></div></div><button class="btn y" id="again">Repetir este caso</button>`;
    $("again").onclick=()=>{step=0;got=[];setMon("idle");draw()};return}
  const d=c.d[step];
  st.innerHTML=`<span style="font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--g2);text-transform:uppercase">${c.rol} · Decisión ${step+1} de ${c.d.length}</span>${step===0?`<div class="sit">${c.s}</div>`:""}<p class="q">${d.p}</p><div class="opts">${d.o.map((o,j)=>`<button class="opt" data-j="${j}">${o[0]}</button>`).join("")}</div><div id="fb"></div>`;
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=d.o[+b.dataset.j];got.push(o[1]);setMon(o[1]);
    st.querySelectorAll(".opt").forEach(x=>x.setAttribute("disabled",""));b.classList.add(o[1]);
    $("fb").innerHTML=`<div class="fb ${o[1]}"><strong>${LBL[o[1]]}</strong>${o[2]}${o[3]!=="—"?`<br><span class="tag">Habilidad: ${o[3]}</span>`:""}</div><button class="btn" id="next" style="margin-top:10px">${step+1<c.d.length?"Siguiente decisión →":"Ver resultado"}</button>`;
    $("next").onclick=()=>{step++;draw()}})}
roles();
</script>
</body></html>
